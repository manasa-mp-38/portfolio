<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#1f293d" stroke-width="0.7" opacity="0.4"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#1f293d" stroke-width="0.7" opacity="0.4"/>

  <!-- Ferris Wheel Silhouette / Amusement Theme -->
  <circle cx="240" cy="225" r="130" stroke="url(#cyanPurple)" stroke-width="3" fill="none" opacity="0.8" filter="url(#glow)"/>
  <circle cx="240" cy="225" r="70" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="240" cy="225" r="16" fill="#00f0ff"/>

  <!-- Spokes -->
  <line x1="240" y1="95" x2="240" y2="355" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.6"/>
  <line x1="110" y1="225" x2="370" y2="225" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.6"/>
  <line x1="148" y1="133" x2="332" y2="317" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.6"/>
  <line x1="148" y1="317" x2="332" y2="133" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.6"/>

  <!-- Gondolas -->
  <rect x="230" y="85" width="20" height="20" rx="4" fill="#9d4edd"/>
  <rect x="230" y="345" width="20" height="20" rx="4" fill="#00f0ff"/>
  <rect x="100" y="215" width="20" height="20" rx="4" fill="#3b82f6"/>
  <rect x="360" y="215" width="20" height="20" rx="4" fill="#facc15"/>

  <!-- Roller Coaster Wave Line -->
  <path d="M50 380 Q 200 200, 380 340 T 750 180" fill="none" stroke="url(#cyanPurple)" stroke-width="4" opacity="0.7" filter="url(#glow)"/>

  <!-- Text & System Modules Dashboard -->
  <rect x="440" y="90" width="310" height="270" rx="14" fill="#0a0e1c" stroke="#25324d" stroke-width="1.5" opacity="0.95"/>
  <text x="470" y="130" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Amusement Park Ops</text>
  <text x="470" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f0ff">Python &bull; MySQL &bull; SQLite &bull; JS</text>

  <!-- Metric Badges -->
  <rect x="470" y="180" width="120" height="60" rx="8" fill="#141c30" stroke="#334155" stroke-width="1"/>
  <text x="485" y="205" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Active Tickets</text>
  <text x="485" y="228" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="18" fill="#10b981">1,480+</text>

  <rect x="610" y="180" width="120" height="60" rx="8" fill="#141c30" stroke="#334155" stroke-width="1"/>
  <text x="625" y="205" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Rides Online</text>
  <text x="625" y="228" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="18" fill="#00f0ff">24 / 24</text>

  <rect x="470" y="260" width="260" height="70" rx="8" fill="#141c30" stroke="#334155" stroke-width="1"/>
  <text x="485" y="285" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Staff Deployment &amp; Visitor Flow</text>
  <rect x="485" y="300" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="485" y="300" width="135" height="8" rx="4" fill="url(#cyanPurple)"/>
  <text x="680" y="308" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f0ff">75%</text>
</svg>
